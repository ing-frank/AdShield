name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: adshield-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publica el APK en "Releases" para poder descargarlo directamente desde el teléfono.
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AdShield.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima AdShield.apk --title "AD Shield (última compilación)" --notes "Compilación automática del commit ${{ github.sha }}"
